##############################################
# Nginx Stream Configuration for Mail Protocols
# This handles SMTP, IMAP, POP3, and Sieve
# Place this in /etc/nginx/modules-enabled/ or include in nginx.conf
##############################################

# IMPORTANT: This must be placed in the main nginx.conf context
# NOT inside the http {} block

stream {
    # Logging
    log_format proxy '$remote_addr [$time_local] '
                     '$protocol $status $bytes_sent $bytes_received '
                     '$session_time "$upstream_addr" '
                     '"$upstream_bytes_sent" "$upstream_bytes_received" "$upstream_connect_time"';

    access_log /var/log/nginx/mail-stream-access.log proxy;
    error_log /var/log/nginx/mail-stream-error.log;

    # Replace MAILCOW_IP with your actual Mailcow server IP

    # SMTP - Port 25 (Incoming mail)
    server {
        listen 25;
        listen [::]:25;
        proxy_pass MAILCOW_IP:25;
        proxy_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # SMTP Submission - Port 587 (Outgoing mail with STARTTLS)
    server {
        listen 587;
        listen [::]:587;
        proxy_pass MAILCOW_IP:587;
        proxy_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # SMTPS - Port 465 (Outgoing mail with SSL)
    server {
        listen 465;
        listen [::]:465;
        proxy_pass MAILCOW_IP:465;
        proxy_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # IMAP - Port 143 (with STARTTLS)
    server {
        listen 143;
        listen [::]:143;
        proxy_pass MAILCOW_IP:143;
        proxy_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # IMAPS - Port 993 (with SSL)
    server {
        listen 993;
        listen [::]:993;
        proxy_pass MAILCOW_IP:993;
        proxy_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # POP3 - Port 110 (with STARTTLS)
    server {
        listen 110;
        listen [::]:110;
        proxy_pass MAILCOW_IP:110;
        proxy_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # POP3S - Port 995 (with SSL)
    server {
        listen 995;
        listen [::]:995;
        proxy_pass MAILCOW_IP:995;
        proxy_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Sieve - Port 4190 (ManageSieve)
    server {
        listen 4190;
        listen [::]:4190;
        proxy_pass MAILCOW_IP:4190;
        proxy_timeout 10s;
        proxy_connect_timeout 5s;
    }
}
