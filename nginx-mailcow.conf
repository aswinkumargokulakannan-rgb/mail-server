##############################################
# Nginx Reverse Proxy Configuration for Mailcow
# Place this file in /etc/nginx/sites-available/
# and symlink to /etc/nginx/sites-enabled/
##############################################

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name mail.example.com autodiscover.example.com autoconfig.example.com;

    # Allow Let's Encrypt verification
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Mailcow Web UI and SOGo
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.example.com;

    # SSL Configuration
    # Replace with your actual SSL certificate paths
    ssl_certificate /etc/letsencrypt/live/mail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.example.com/privkey.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/mailcow-access.log;
    error_log /var/log/nginx/mailcow-error.log;

    # Client upload size (for attachments)
    client_max_body_size 50M;

    # Proxy settings
    location / {
        proxy_pass http://MAILCOW_IP:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for SOGo
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }
}

# Autodiscover - Microsoft Outlook
